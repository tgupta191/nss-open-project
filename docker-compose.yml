version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: welfare_backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/backend/data
    environment:
      - DATABASE_URL=sqlite:///./welfare_chatbot.db
      - ENV=production
      - DEBUG=False
      # Add API keys here if building locally
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: welfare_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
